name: Build launcher

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier la syntaxe
        shell: bash
        run: |
          for f in src/main/*.js src/renderer/*.js; do node --check "$f"; done

      - name: Tests du moteur
        run: node test/core.test.js

      # Build simple (push normal) : fichiers disponibles dans "Artifacts"
      - name: Build (sans publication)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Build + Release GitHub (quand tu pousses un tag v1.0.0, v1.0.1…)
      - name: Build et publier la Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Envoyer les fichiers dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 802-client-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn
